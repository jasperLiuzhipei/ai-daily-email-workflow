<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>AI 日报点击追踪测试</title>
  </head>
  <body style="font-family:Arial,sans-serif;line-height:1.6;color:#1f2937;">
    <h1>AI 日报点击追踪测试</h1>
    <p>这是一封仅用于验收链接点击统计的测试邮件。</p>
    <p>
      <a
        href="https://openai.com/"
        data-ai-daily-track-link="1"
        data-ai-daily-track-title="OpenAI 官网（点击追踪测试）"
      >打开测试原文</a>
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0">
      <tr data-ai-daily-feedback="1">
        <td>
          <p>今天这期怎么样？</p>
          <p>
            <a href="#" data-ai-daily-rating="1">☆</a>
            <a href="#" data-ai-daily-rating="2">☆</a>
            <a href="#" data-ai-daily-rating="3">☆</a>
            <a href="#" data-ai-daily-rating="4">☆</a>
            <a href="#" data-ai-daily-rating="5">☆</a>
            <a href="#" data-ai-daily-comment="1">写一句建议</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
